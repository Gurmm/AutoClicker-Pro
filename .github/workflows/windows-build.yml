
name: Windows EXE build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pynput

      - name: Build Windows EXE
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name AutoClicker_Pro src/auto_clicker_pro.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker_Pro_Windows
          path: dist/AutoClicker_Pro.exe
          if-no-files-found: error
